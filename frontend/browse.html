<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPeek — Browse Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/detail.css">
  <script src="js/page-fade.js" defer blocking="render"></script>
</head>
<body style="visibility:hidden;">
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">i</div>
      Research Repository
    </div>
    <div class="nav-links"></div>
    <div class="nav-right">
      <a href="profile.html" class="avatar" id="avatarEl" title="View Profile"></a>
      <span class="role-pill" id="rolePill"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <!-- Mobile filter FAB -->
  <button class="filter-fab" id="filterFab" aria-label="Open filters" onclick="openFilterSheet()"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="icons.svg#filter"/></svg></button>

  <!-- Glass filter bottom sheet (mobile) -->
  <div class="glass-sheet-overlay" id="filterOverlay" onclick="closeFilterSheet()"></div>
  <dialog class="glass-sheet" id="filterSheet" aria-label="Browse filters">
    <div class="glass-sheet-handle"></div>
    <div class="glass-sheet-title">Filters</div>
    <button type="button" class="btn btn-ghost" onclick="closeFilterSheet()">Close filters</button>

    <div class="sb-section college-filters">Loading colleges...</div>

  </dialog>

  <div class="layout">
    <!-- Left filter sidebar (desktop) -->
    <div class="sidebar">

      <div class="sb-section college-filters">Loading colleges...</div>

    </div>

    <!-- Main content area -->
    <div class="main">
      <div class="hero">
        <div>
          <h2>Explore ISAT-U Research</h2>
          <p>Capstone and thesis projects · Main Campus · Approved papers</p>
        </div>
        <span class="badge badge-validated">ISAT-U Main Campus</span>
      </div>

      <div class="search-wrap mb-md">
        <span class="search-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="icons.svg#search"/></svg></span>
        <input type="text" id="searchInput" placeholder="Search title or author...">
      </div>

      <div class="year-pills">
        <label for="yearFilter">Year</label>
        <div class="browse-year-select">
          <select id="yearFilter" class="form-input" disabled></select>
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="icons.svg#chevron-right"/></svg>
        </div>
      </div>

      <div class="results-bar">
        <span id="resultsCount">Loading...</span>
      </div>

      <div class="research-grid" id="grid"></div>

      <div id="empty" class="empty-state" style="display:none;">
        <div class="empty-state-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="icons.svg#inbox"/></svg></div>
        <p>No research found. Try adjusting your filters.</p>
      </div>

      <div id="loading" class="text-center" style="padding:60px 0;color:var(--muted);">
        <div class="spinner spinner-lg" style="margin:0 auto 12px;"></div>
        <p>Loading repository...</p>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="js/api.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/pillnav.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/browse.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/detail-overlay.js"></script>

  <script>
    function openFilterSheet() {
      document.getElementById("filterSheet").classList.add("open");
      uiDialog.open("filterSheet", closeFilterSheet);
    }
    function closeFilterSheet() {
      document.getElementById("filterOverlay").classList.remove("open");
      document.getElementById("filterSheet").classList.remove("open");
      uiDialog.close("filterSheet");
    }

    async function logout() {
      try { await apiLogout(); } catch {}
      sessionStorage.clear();
      window.location.replace("index.html");
    }
  </script>

</body>
</html>
